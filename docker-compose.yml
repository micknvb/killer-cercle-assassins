services:
  killer:
    container_name: killer-game
    image: killer-game:latest
    build:
      context: ./app
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATA_DIR: /data
      TZ: Europe/Paris
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:3099:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - caddy_net

networks:
  caddy_net:
    external: true
    name: caddy_net
